# Signer-disjoint-val BdSLW401 (val = held-out signer S15; preprocessing/make_w401_sdval_bundle.py). Identical to bdsl_st_gcn_w401_test_front.yaml except data paths.
Experiment_name: bdsl_st_gcn_w401_sdval_test
# TEST-ONLY: evaluate a trained CTR-GCN (adaptive_gnn) checkpoint on the
# BdSLW401 FRONT held-out TEST split. Use: main.py --phase test --weights <ckpt>
feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: data/bdslw401_si_sdval/test_data.npy
  label_path: data/bdslw401_si_sdval/test_label.pkl
  debug: False
  normalization: True
  is_vector: False
  lap_pe: False
  window_size: 120
  random_choose: False
test_feeder_args:
  data_path: data/bdslw401_si_sdval/test_data.npy
  label_path: data/bdslw401_si_sdval/test_label.pkl
  random_mirror: False
  normalization: True
  is_vector: False
  lap_pe: False
  window_size: 120
  random_choose: False
model: model.st_gcn_vanilla.Model
model_args:
  num_class: 401
  num_point: 27
  num_person: 1
  graph: graph.sign_27.Graph
  graph_args:
    labeling_mode: 'spatial'
  in_channels: 3
device: [0]
batch_size: 32
test_batch_size: 32
wandb: False
num_worker: 0
