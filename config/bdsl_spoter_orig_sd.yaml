Experiment_name: bdsl_spoter_orig_sd

# original SPOTER (Bohacek & Hruz, WACV-W 2022: 6+6-layer encoder/decoder, class query, d_model = V*C = 81, 9 heads)
# Signer-mixed (signer-dependent) split; 'Mixed' = best-epoch Top-1 on sd val (as in tab:smg8).
# Shared recipe (Track A, as run for the 8-arch table): 27-kpt pose, T=120, mirror OFF,
# SGD+nesterov, wd 1e-4, warm-up 5, step [60,80], 100 epochs, batch 16, 3 seeds.
# base_lr is the only tuned knob: selected on val U15 at seed 0 from
# {0.1, 0.05, 0.01} + SPOTER's native 0.001 (scripts/hpc/slurm_spoter.sbatch writes it here).

feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: data/bdsl_sd/train_data.npy
  label_path: data/bdsl_sd/train_label.pkl
  debug: False
  random_choose: True
  window_size: 120
  random_shift: True
  normalization: True
  random_mirror: False
  random_mirror_p: 0.0
  is_vector: False
  lap_pe: False

test_feeder_args:
  data_path: data/bdsl_sd/val_data.npy
  label_path: data/bdsl_sd/val_label.pkl
  random_mirror: False
  normalization: True
  lap_pe: False
  window_size: 120
  random_choose: False

model: model.spoter.Model
model_args:
  num_class: 60
  num_point: 27
  num_person: 1
  in_channels: 3
  variant: spoter
  num_heads: 9
  num_encoder_layers: 6
  num_decoder_layers: 6

weight_decay: 0.0001
base_lr: 0.001   # selected on val U15 @ seed 0 from {0.1,0.05,0.01,0.001}
step: [60, 80]
device: [0]
batch_size: 16
test_batch_size: 16
num_epoch: 100
nesterov: True
warm_up_epoch: 5
optimizer: SGD
wandb: False
num_worker: 2
save_interval: 5
