Experiment_name: bdsl_gnn_transformer_sd_clip5

feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: ./data/bdsl_sd/train_data.npy
  label_path: ./data/bdsl_sd/train_label.pkl
  debug: False
  random_choose: True
  random_shift: True
  random_move: False
  window_size: 120
  normalization: True
  random_mirror: False
  random_mirror_p: 0.0
  is_vector: False
  lap_pe: False

test_feeder_args:
  data_path: ./data/bdsl_sd/val_data.npy
  label_path: ./data/bdsl_sd/val_label.pkl
  window_size: 120
  random_choose: False
  normalization: True

model: model.gnn_transformer.Model
model_args:
  num_class: 60
  num_point: 27
  num_person: 1
  graph: graph.sign_27.Graph
  graph_args:
    labeling_mode: 'spatial'
  in_channels: 3

weight_decay: 0.0001
base_lr: 0.01
step: [60, 80]

device: [0]
batch_size: 16
test_batch_size: 16
num_epoch: 100
nesterov: True
warm_up_epoch: 5

wandb: False
num_worker: 0

# Stability control (RECIPE_CONTROL.md), matching config/bdsl_gnn_transformer_si_clip5.yaml.
# NOTE: this is exactly the effective recipe of the existing work_dir/bdsl_gnn_transformer_sd_seed{0,1,2}
# runs (launched with --grad_clip_norm 5.0 via EXTRA_ARGS; see their saved config.yaml).
grad_clip_norm: 5.0
