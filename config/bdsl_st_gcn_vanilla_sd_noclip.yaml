# Mixed-split (bdsl_sd) run with NO gradient clipping, matching the unclipped Protocol-A
# headline run. The original bdsl_st_gcn_vanilla_sd_seed* runs were launched with --grad_clip_norm 5.0.
Experiment_name: bdsl_st_gcn_vanilla_sd_noclip

feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: ./data/bdsl_sd/train_data.npy
  label_path: ./data/bdsl_sd/train_label.pkl
  debug: False
  random_choose: True
  random_shift: True
  random_move: False
  window_size: 120
  normalization: True
  random_mirror: False
  random_mirror_p: 0.0
  is_vector: False
  lap_pe: False

test_feeder_args:
  data_path: ./data/bdsl_sd/val_data.npy
  label_path: ./data/bdsl_sd/val_label.pkl
  window_size: 120
  random_choose: False
  normalization: True

model: model.st_gcn_vanilla.Model
model_args:
  num_class: 60
  num_point: 27
  num_person: 1
  graph: graph.sign_27.Graph
  graph_args:
    labeling_mode: 'spatial'
  in_channels: 3

weight_decay: 0.0001
base_lr: 0.01
step: [60, 80]

device: [0]
batch_size: 16
test_batch_size: 16
num_epoch: 100
nesterov: True
warm_up_epoch: 5

wandb: False
num_worker: 0
grad_clip_norm: 0.0
