Experiment_name: autsl_si_ctrgcn

# AUTSL (Turkish SL, 226 classes), OFFICIAL signer-disjoint split.
#   Signers: train 31 / val 6 / test 6 (signer-disjoint).
#   Clips:   train 28130 / val 4418 / test 3741.
# STRONG, STABLE skeleton baseline: CTR-GCN-style adaptive GNN (MS-TCN +
# stabilized adaptive graph) with the canonical CTR-GCN recipe (SGD lr 0.1,
# batch 64, wd 4e-4, step schedule, 5-epoch warmup). Replaces the unstable
# BlockGCN SGD lr 0.1 batch 32 baseline (autsl_si*), which had a seed-2
# collapse (69.7% TEST) and 84.85 +/- 10.9 headline variance.
# In-training model selection on the official VAL signers; final numbers
# come from a separate --phase test pass (config/autsl_si_ctrgcn_test.yaml).

feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: data/autsl_si/train_data.npy
  label_path: data/autsl_si/train_label.pkl
  debug: False
  random_choose: True
  window_size: 120
  random_shift: True
  random_move: False
  normalization: True
  random_mirror: False       # off: signer hand-dominance is class-informative
  random_mirror_p: 0.0
  is_vector: False
  lap_pe: False

test_feeder_args:
  data_path: data/autsl_si/val_data.npy     # official VAL for in-training selection; TEST held out
  label_path: data/autsl_si/val_label.pkl
  random_mirror: False
  normalization: True
  is_vector: False
  lap_pe: False
  window_size: 120
  random_choose: False

# model
model: model.adaptive_gnn.Model
model_args:
  num_class: 226
  num_point: 27
  num_person: 1
  graph: graph.sign_27.Graph
  graph_args:
    labeling_mode: 'spatial'
  in_channels: 3

# optim — CTR-GCN canonical recipe
weight_decay: 0.0004
base_lr: 0.1
step: [35, 55, 75]

# training
device: [0]
batch_size: 64
test_batch_size: 64
num_epoch: 90
nesterov: True
warm_up_epoch: 5
optimizer: SGD

wandb: False
num_worker: 0
save_interval: 10
