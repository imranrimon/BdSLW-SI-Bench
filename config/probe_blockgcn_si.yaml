# Probe config for the recipe-matched signer-adversarial (sadvR) backbones.
# decodability_probe.py reads `backbone`/`backbone_args` and sets return_features=True.
# Args mirror config/bdsl_block_gcn_si.yaml model_args EXACTLY so the saved
# BlockGCN backbone state_dicts load cleanly.
backbone: model.block_gcn.Model
backbone_args:
  num_class: 60
  num_point: 27
  num_person: 1
  graph: graph.sign_27.Graph
  graph_args:
    labeling_mode: spatial
  in_channels: 3
  num_blocks: [2, 2, 2, 2]
  stage_channels: [64, 128, 256, 256]
  max_distance: 8
