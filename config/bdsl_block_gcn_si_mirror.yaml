Experiment_name: bdsl_block_gcn_si_mirror

# Item-C augmentation ablation: random_mirror ON (p=0.5). The standard SI recipe
# keeps mirroring OFF because BdSL hand-dominance is class-informative; this run
# turns it on to quantify the cost. Compare vs full BlockGCN SI TEST (65.23,
# mirror off). Same shared recipe otherwise. TEST-time feeder stays un-mirrored.

feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: data/bdsl_si/train_data.npy
  label_path: data/bdsl_si/train_label.pkl
  debug: False
  random_choose: True
  window_size: 120
  random_shift: True
  normalization: True
  random_mirror: True
  random_mirror_p: 0.5
  is_vector: False
  lap_pe: False

test_feeder_args:
  data_path: data/bdsl_si/val_data.npy
  label_path: data/bdsl_si/val_label.pkl
  random_mirror: False
  normalization: True
  is_vector: False
  lap_pe: False
  window_size: 120
  random_choose: False

model: model.block_gcn.Model
model_args:
  num_class: 60
  num_point: 27
  num_person: 1
  graph: graph.sign_27.Graph
  graph_args:
    labeling_mode: 'spatial'
  in_channels: 3
  num_blocks: [2, 2, 2, 2]
  stage_channels: [64, 128, 256, 256]
  max_distance: 8

weight_decay: 0.0001
base_lr: 0.1
step: [60, 80]

device: [0]
keep_rate: 0.9
only_train_epoch: 1
batch_size: 32
test_batch_size: 32
num_epoch: 100
nesterov: True
warm_up_epoch: 5
optimizer: SGD

wandb: False
num_worker: 0
save_interval: 10
