Experiment_name: bdsl_block_gcn_si_rtm

# HONEST TEST-signer eval of the RTMPose-133 pose-quality ablation.
# Identical to config/bdsl_block_gcn_si_rtm.yaml EXCEPT test_feeder points at
# the held-out TEST split (U02,U13) instead of val (U15). Run with:
#   TEST_CONFIG=bdsl_block_gcn_si_rtm_test \
#   EXPS="bdsl_block_gcn_si_rtm_seed0 bdsl_block_gcn_si_rtm_seed1 bdsl_block_gcn_si_rtm_seed2" \
#   sbatch scripts/hpc/slurm_test_eval.sbatch
# Purpose (C1 footing control): shows the MediaPipe-vs-RTMPose pose source does
# not move the SI TEST number, so the Uni-Sign lead is pretraining, not keypoints.

# feeder
feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: data/bdsl_si_rtm/train_data.npy
  label_path: data/bdsl_si_rtm/train_label.pkl
  debug: False
  random_choose: True
  window_size: 120
  random_shift: True
  normalization: True
  random_mirror: False
  random_mirror_p: 0.0
  is_vector: False
  lap_pe: False

test_feeder_args:
  data_path: data/bdsl_si_rtm/test_data.npy
  label_path: data/bdsl_si_rtm/test_label.pkl
  random_mirror: False
  normalization: True
  is_vector: False
  lap_pe: False
  window_size: 120
  random_choose: False

# model
model: model.block_gcn.Model
model_args:
  num_class: 60
  num_point: 27
  num_person: 1
  graph: graph.sign_27.Graph
  graph_args:
    labeling_mode: 'spatial'
  in_channels: 3
  num_blocks: [2, 2, 2, 2]
  stage_channels: [64, 128, 256, 256]
  max_distance: 8

# optim
weight_decay: 0.0001
base_lr: 0.1
step: [60, 80]

# training
device: [0]
keep_rate: 0.9
only_train_epoch: 1
batch_size: 32
test_batch_size: 32
num_epoch: 100
nesterov: True
warm_up_epoch: 5
optimizer: SGD

wandb: False
num_worker: 0
save_interval: 10
