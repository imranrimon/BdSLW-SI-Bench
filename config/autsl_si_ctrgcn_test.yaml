Experiment_name: autsl_si_ctrgcn_test

# TEST-signer eval config for the strong CTR-GCN AUTSL-SI baseline.
# Identical model/recipe to config/autsl_si_ctrgcn.yaml, but test_feeder_args
# points at the OFFICIAL held-out TEST signers (data/autsl_si/test_data.npy).
# Used only via: python main.py --config <this> --phase test --weights <best.pt>

feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: data/autsl_si/train_data.npy
  label_path: data/autsl_si/train_label.pkl
  debug: False
  random_choose: True
  window_size: 120
  random_shift: True
  random_move: False
  normalization: True
  random_mirror: False
  random_mirror_p: 0.0
  is_vector: False
  lap_pe: False

test_feeder_args:
  data_path: data/autsl_si/test_data.npy    # OFFICIAL held-out TEST signers
  label_path: data/autsl_si/test_label.pkl
  random_mirror: False
  normalization: True
  is_vector: False
  lap_pe: False
  window_size: 120
  random_choose: False

# model
model: model.adaptive_gnn.Model
model_args:
  num_class: 226
  num_point: 27
  num_person: 1
  graph: graph.sign_27.Graph
  graph_args:
    labeling_mode: 'spatial'
  in_channels: 3

# optim — CTR-GCN canonical recipe (unused at test time; kept for parity)
weight_decay: 0.0004
base_lr: 0.1
step: [35, 55, 75]

# training
device: [0]
batch_size: 64
test_batch_size: 64
num_epoch: 90
nesterov: True
warm_up_epoch: 5
optimizer: SGD

wandb: False
num_worker: 0
save_interval: 10
