# Signer-independent (SI) benchmark sweep registry: the canonical per-architecture configs.
#
#   python tools/run_multiseed.py --config experiments_si.yaml --seeds 0 1 2 --skip-existing
#   python tools/run_loso.py      --config experiments_si.yaml --seeds 0 1 2
#
# Data: data/bdsl_si/ from preprocessing/generate_signer_split_npy.py (see README).
# The paper's headline rows use per-architecture final recipes on top of these configs
# (validation-selected base LR, grad-norm clipping for GNN+Transformer, best-on-val TEST
# checkpoints); results/run_manifest.csv lists the exact config, seed and checkpoint of
# every run the paper tables read.

experiments:
  # Pose baselines
  - name: "Pose-LSTM (SI)"
    config: "config/bdsl_pose_lstm_si.yaml"
    description: "Baseline Bi-LSTM on flattened pose sequences"

  - name: "ST-GCN Vanilla (SI)"
    config: "config/bdsl_st_gcn_vanilla_si.yaml"
    description: "Pure ST-GCN without attention or dilations"

  - name: "Attention GNN (SI)"
    config: "config/bdsl_gnn_si.yaml"
    description: "ST-GCN + Dilated TCN + Spatial/Temporal attention"

  - name: "Adaptive GNN (SI)"
    config: "config/bdsl_adaptive_gnn_si.yaml"
    description: "MS-TCN + stabilized adaptive graph (CTR-GCN style)"

  - name: "GNN + Bi-LSTM (SI)"
    config: "config/bdsl_gnn_lstm_si.yaml"
    description: "Spatial GCN + Bi-LSTM temporal modelling"

  - name: "GNN + Transformer (SI)"
    config: "config/bdsl_gnn_transformer_si.yaml"
    description: "Spatial GCN + Transformer encoder temporal modelling"

  - name: "SLGTFormer (SI)"
    config: "config/bdsl_slgtformer_si.yaml"
    description: "Full SLGTFormer (LGRPE + TTSA + PAF) baseline"

  - name: "BlockGCN (SI)"
    config: "config/bdsl_block_gcn_si.yaml"
    description: "BlockGCN backbone with topological encoding"



  # Feature isolation: same temporal transformer on pose vs DINOv2 crop features
  - name: "FlatTemporal (Pose, SI)"
    config: "config/bdsl_pose_temporal_si.yaml"
    description: "Temporal transformer over flattened 27-keypoint pose (pose input)"

  - name: "FlatTemporal (DINOv2, SI)"
    config: "config/bdsl_dino_temporal_si.yaml"
    description: "Same transformer, DINOv2 hand/face features instead of pose"
